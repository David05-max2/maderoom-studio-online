<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <title>Maderoom Studio Online</title>
    <link rel="stylesheet" href="/maderoom-studio-online/src/styles.css" />
    <style>
      #boot-status{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;background:#f3f2ef;color:#171717;padding:24px}
      #boot-card{width:min(520px,100%);background:white;border:1px solid #e6e2db;border-radius:18px;padding:28px;box-shadow:0 16px 48px rgba(0,0,0,.08)}
      #boot-card h1{margin:0 0 8px;font-size:24px} #boot-card p{margin:0;color:#77736d;line-height:1.55} #boot-error{display:none;margin-top:18px;padding:14px;border-radius:12px;background:#fff1f0;color:#8b1e16;white-space:pre-wrap;font-size:12px;overflow:auto}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-status"><div id="boot-card"><h1>Maderoom Studio Online</h1><p id="boot-message">Cargando aplicación…</p><div id="boot-error"></div></div></div>

    <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
    <script>
      (async function () {
        const base = '/maderoom-studio-online/'
        const status = document.getElementById('boot-status')
        const message = document.getElementById('boot-message')
        const errorBox = document.getElementById('boot-error')
        const externals = {
          'react': 'https://esm.sh/react@18.3.1',
          'react-dom/client': 'https://esm.sh/react-dom@18.3.1/client',
          'react/jsx-runtime': 'https://esm.sh/react@18.3.1/jsx-runtime',
          'lucide-react': 'https://esm.sh/lucide-react@0.468.0',
          '@supabase/supabase-js': 'https://esm.sh/@supabase/supabase-js@2.57.4'
        }

        const order = [
          'src/domain/rules.ts',
          'src/domain/cutting.ts',
          'src/lib/supabase.ts',
          'src/lib/data.ts',
          'src/lib/extras.ts',
          'src/App.tsx',
          'src/main.tsx'
        ]
        const urls = {}

        function resolveLocal(fromPath, specifier) {
          const from = new URL(fromPath, 'https://maderoom.local/')
          const resolved = new URL(specifier, from)
          let path = resolved.pathname.replace(/^\//, '')
          const candidates = [path, path + '.ts', path + '.tsx', path + '/index.ts', path + '/index.tsx']
          return candidates.find(c => order.includes(c)) || path
        }

        function rewriteImports(code, currentPath) {
          return code.replace(/(from\s*["']|import\s*["'])([^"']+)(["'])/g, function (_, prefix, specifier, suffix) {
            if (externals[specifier]) return prefix + externals[specifier] + suffix
            if (specifier.startsWith('.')) {
              const resolved = resolveLocal(currentPath, specifier)
              if (!urls[resolved]) throw new Error('Dependencia local no compilada: ' + specifier + ' desde ' + currentPath)
              return prefix + urls[resolved] + suffix
            }
            return prefix + specifier + suffix
          })
        }

        try {
          if (!window.Babel) throw new Error('No se pudo cargar el compilador del navegador.')
          for (const path of order) {
            message.textContent = 'Preparando ' + path.replace('src/', '') + '…'
            const response = await fetch(base + path + '?v=' + Date.now(), { cache: 'no-store' })
            if (!response.ok) throw new Error('No se pudo cargar ' + path + ' (' + response.status + ')')
            const source = await response.text()
            const transformed = Babel.transform(source, {
              filename: path,
              sourceType: 'module',
              presets: [
                ['typescript', { allExtensions: true, isTSX: path.endsWith('.tsx') }],
                ['react', { runtime: 'automatic' }]
              ]
            }).code
            const rewritten = rewriteImports(transformed, path)
            urls[path] = URL.createObjectURL(new Blob([rewritten], { type: 'text/javascript' }))
          }
          message.textContent = 'Iniciando…'
          await import(urls['src/main.tsx'])
          status.remove()
        } catch (error) {
          console.error(error)
          message.textContent = 'No se pudo iniciar la aplicación.'
          errorBox.style.display = 'block'
          errorBox.textContent = String(error && error.stack ? error.stack : error)
        }
      })()
    </script>
  </body>
</html>
