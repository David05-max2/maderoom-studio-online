name: Build Maderoom Studio Online

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maderoom-pages-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build production app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://uvuqzpannpujnqiwfjiu.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_UP3i7rK2_50FFI9Um2fhAQ_aUmSYiBB

      - name: Validate bundle
        run: |
          test -f dist/index.html
          echo '--- dist/index.html ---'
          cat dist/index.html
          echo '--- files ---'
          find dist -maxdepth 2 -type f -print

      - name: Publish compiled site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
