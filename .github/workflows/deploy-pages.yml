name: Deploy Maderoom Studio Online

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build production app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://uvuqzpannpujnqiwfjiu.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_UP3i7rK2_50FFI9Um2fhAQ_aUmSYiBB

      - name: Verify production bundle
        run: |
          test -f dist/index.html
          test -d dist/assets
          if grep -q '/src/' dist/index.html; then
            echo 'ERROR: dist/index.html still references source files'
            cat dist/index.html
            exit 1
          fi
          echo 'Production bundle verified.'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production artifact
        id: deployment
        uses: actions/deploy-pages@v4
