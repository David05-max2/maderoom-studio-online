name: Deploy Maderoom Studio Online

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build production app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://uvuqzpannpujnqiwfjiu.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_UP3i7rK2_50FFI9Um2fhAQ_aUmSYiBB

      - name: Inspect production bundle
        run: |
          echo '--- dist files ---'
          find dist -maxdepth 2 -type f -print
          echo '--- dist/index.html ---'
          cat dist/index.html
          test -f dist/index.html

      - name: Force Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/pages \
            -f build_type=workflow

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production artifact
        id: deployment
        uses: actions/deploy-pages@v4
